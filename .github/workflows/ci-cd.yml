name: CI e CD - Lista de Tarefas
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: CI - Testes e Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Testar API
        run: python -m pytest -v
      - name: Validar build Docker
        run: docker build -t lista-tarefas:test .
  cd:
    name: CD - Publicar imagem
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  deploy:
    name: Implantar e verificar Render
    needs: cd
    if: vars.RENDER_SERVICE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar deploy da imagem publicada
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.cd.outputs.image }}:${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Configure RENDER_DEPLOY_HOOK_URL'; exit 1; }
          curl --fail --silent --show-error --get --data-urlencode "imgURL=$IMAGE" "$DEPLOY_HOOK" > /dev/null
      - name: Confirmar versao em execucao
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          python - <<'PYTHON'
          import json, os, time, urllib.request
          url = os.environ['SERVICE_URL'].rstrip('/') + '/health'
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
                  if data.get('version') == os.environ['EXPECTED_VERSION']:
                      print('Render respondeu com a versao publicada:', data)
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('A nova versao nao foi confirmada no Render.')
          PYTHON
